<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Журнал анкет{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header>
      <h1>Сайт обработчика анкет</h1>

      <nav>
        <a href="{{ url_for('get_accepted_questionaries') }}">Главная</a>
        <a href="{{ url_for('get_statistics') }}">Статистика</a>
        <a href="{{ url_for('get_questionary_form') }}">Добавить анкету</a>
      </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>
      <p>Журнал обработки анкет</p>
    </footer>
  </body>
</html>
